<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامع نورة سعد العبيد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>نورة سعد العبيد</h1>
    </header>

    <section id="photo-album">
        <div class="album-container">
            <button id="prev-btn">السابق</button>
            <img id="album-image" src="https://media.gemini.media/img/large/2018/3/2/2018_3_2_14_10_55_432.jpg" alt="صورة للمسجد">
            <button id="next-btn">التالي</button>
        </div>
    </section>

    <section id="social-links">
        <h2>تابعونا على</h2>
        <div class="links-container">
            <a href="#" target="_blank"><img src="images/youtube.png" alt="يوتيوب"></a>
            <a href="#" target="_blank"><img src="images/tiktok.png" alt="تيك توك"></a>
            <a href="#" target="_blank"><img src="images/telegram.png" alt="تليجرام"></a>
            <a href="#" target="_blank"><img src="images/instagram.png" alt="انستقرام"></a>
        </div>
    </section>

    <section id="suggestions">
        <h2>اقتراحاتكم تهمنا</h2>
        <a href="#" target="_blank" class="suggestion-link">نموذج الاقتراحات</a>
    </section>

    <script src="script.js"></script>
</body>
</html>

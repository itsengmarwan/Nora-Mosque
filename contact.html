<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - جامع نورة سعد العبيد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-inner">
                <div class="logo">
                    <img src="images/mosque-logo.png" alt="شعار المسجد">
                    <div class="logo-text">
                        <h1>نورة سعد العبيد</h1>
                        <p>صرح إسلامي شامخ</p>
                    </div>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="about.html">عن المسجد</a></li>
                        <li><a href="gallery.html">مكتبة الصور</a></li>
                        <li><a href="contact.html">تواصل معنا</a></li>
                        <li><a href="news.html">الأخبار والفعاليات</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main id="contact-page">
            <h2>تواصل معنا</h2>
            <p>يمكنكم التواصل معنا عبر النموذج التالي أو عبر وسائل الاتصال المتاحة.</p>
            <form action="#" method="post" class="contact-form">
                <div>
                    <label for="name">الاسم:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="email">البريد الإلكتروني:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="message">الرسالة:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">إرسال</button>
            </form>
            <div class="contact-info">
                <p>أو يمكنكم التواصل عبر:</p>
                <ul>
                    <li>الهاتف: [رقم الهاتف]</li>
                    <li>البريد الإلكتروني: [البريد الإلكتروني]</li>
                </ul>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>

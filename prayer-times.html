<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مواقيت الصلاة - مسجد نورا</title>
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #fff;
      color: #000;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #000;
      color: #ffd700;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .date {
      margin: 15px 0;
      font-size: 18px;
      color: #444;
    }
    .times {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 400px;
      margin: auto;
      background: #f9f9f9;
      padding: 20px;
      border: 2px solid #000;
      border-radius: 10px;
    }
    .prayer {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 18px;
    }
    .label {
      color: #000;
    }
    .time {
      color: #d4af37;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>مواقيت الصلاة - السالمية، الكويت</header>
  <div class="date" id="today"></div>
  <div class="times" id="prayer-times">
    جاري التحميل...
  </div>

  <script>
    const today = new Date();
    const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById("today").textContent = today.toLocaleDateString('ar-EG', dateOptions);

    fetch("https://api.aladhan.com/v1/timingsByCity?city=Salmiya&country=Kuwait&method=3")
      .then(response => response.json())
      .then(data => {
        const timings = data.data.timings;
        const prayerList = {
          "الفجر": timings.Fajr,
          "الشروق": timings.Sunrise,
          "الظهر": timings.Dhuhr,
          "العصر": timings.Asr,
          "المغرب": timings.Maghrib,
          "العشاء": timings.Isha
        };

        const container = document.getElementById("prayer-times");
        container.innerHTML = '';

        for (const [label, time] of Object.entries(prayerList)) {
          const div = document.createElement("div");
          div.className = "prayer";
          div.innerHTML = `<span class="label">${label}</span><span class="time">${convertTo12Hour(time)}</span>`;
          container.appendChild(div);
        }
      });

    function convertTo12Hour(time24) {
      const [hour, minute] = time24.split(":").map(Number);
      const ampm = hour >= 12 ? 'م' : 'ص';
      const hour12 = ((hour + 11) % 12 + 1);
      return `${hour12}:${minute.toString().padStart(2, '0')} ${ampm}`;
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة - السالمية</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2e2e2e;
            color: #fff;
            text-align: center;
            padding: 50px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            font-size: 1.5em;
            margin: 10px 0;
        }

        .time {
            color: #ffcc00;
        }

        .container {
            display: inline-block;
            background-color: #333;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مسجد نورة سعد العبيد</h1>
        <h2>مواقيت الصلاة - السالمية</h2>
        <div id="prayer-times"></div>
    </div>

    <script>
        fetch("https://api.aladhan.com/v1/timingsByCity?city=Salmiya&country=Kuwait&method=2")
            .then(response => response.json())
            .then(data => {
                const timings = data.data.timings;
                const container = document.getElementById("prayer-times");

                container.innerHTML = `
                    <ul>
                        <li>الفجر: <span class="time">${timings.Fajr}</span></li>
                        <li>الشروق: <span class="time">${timings.Sunrise}</span></li>
                        <li>الظهر: <span class="time">${timings.Dhuhr}</span></li>
                        <li>العصر: <span class="time">${timings.Asr}</span></li>
                        <li>المغرب: <span class="time">${timings.Maghrib}</span></li>
                        <li>العشاء: <span class="time">${timings.Isha}</span></li>
                    </ul>
                `;
            })
            .catch(error => {
                console.error("Error fetching prayer times:", error);
            });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة - جامع نورة سعد العبيد</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيقات خاصة بصفحة مواقيت الصلاة */
        #prayer-times-page {
            padding-top: 80px; /* عشان المحتوى مينزلش تحت الهيدر الثابت */
            padding-bottom: 30px; /* مساحة بسيطة من تحت */
            text-align: center; /* توسيط عام للنص داخل main */
        }

        #q8prayers {
            margin: 30px auto; /* توسيط أفقي - دي المفروض تكون كافية */
            max-width: 600px; /* تحديد عرض أقصى */
        }

        #q8prayers table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        #q8prayers th,
        #q8prayers td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        #q8prayers th {
            font-weight: bold;
            color: #555; /* لون عناوين الجدول */
        }

        #q8prayers td:first-child {
            font-weight: bold;
            color: #333; /* لون أسماء الصلوات */
        }

        #q8prayers td:last-child {
            color: #b8860b; /* لون مواقيت الصلاة الذهبي */
            font-weight: bold;
        }

        /* ممكن نضيف لون خلفية فاتح للجدول عشان ميكونش كله أبيض */
        #q8prayers table {
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            overflow: hidden; /* عشان الـ border-radius يشتغل كويس */
        }

        /* لون الخط الرئيسي في الصفحة */
        body {
            color: #333;
        }

        /* لون العنوان الرئيسي للصفحة */
        #prayer-times-page h2 {
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-inner">
                <div class="logo">
                    <img src="images/mosque-logo.png" alt="شعار المسجد">
                    <div class="logo-text">
                        <h1>جامع نورة سعد العبيد</h1>
                        <p>مواقيت الصلاة</p>
                    </div>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="about.html">عن المسجد</a></li>
                        <li><a href="gallery.html">مكتبة الصور</a></li>
                        <li><a href="prayer-times.html">مواقيت الصلاة</a></li>
                        <li><a href="contact.html">تواصل معنا</a></li>
                        <li><a href="news.html">الأخبار والفعاليات</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main id="prayer-times-page">
            <h2>مواقيت الصلاة - السالمية</h2>
            <div id="q8prayers" data-lang="ar" data-theme="light" data-size="md" data-date="gregorian"></div>
        </main>
    </div>
    <script src="https://q8p.io/js"></script>
    <script src="script.js"></script>
</body>
</html>

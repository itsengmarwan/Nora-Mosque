<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة - جامع نورة سعد العبيد</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيقات خاصة بصفحة مواقيت الصلاة */
        #prayer-times-page {
            padding-top: 80px;
            padding-bottom: 30px;
            position: relative; /* عشان يكون الأب للعنصر اللي هيتوسط بشكل مطلق */
            text-align: center; /* توسيط عام للنص كاحتياط */
        }

        .prayer-times-wrapper {
            max-width: 600px;
            width: 100%;
            margin-top: 30px;
        }

        .prayer-times-wrapper table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .prayer-times-wrapper th,
        .prayer-times-wrapper td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .prayer-times-wrapper th {
            font-weight: bold;
            color: #555;
        }

        .prayer-times-wrapper td:first-child {
            font-weight: bold;
            color: #333;
        }

        .prayer-times-wrapper td:last-child {
            color: #b8860b;
            font-weight: bold;
        }

        body {
            color: #333;
            text-align: center;
        }

        #prayer-times-page h2 {
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-inner">
                <div class="logo">
                    <img src="images/mosque-logo.png" alt="شعار المسجد">
                    <div class="logo-text">
                        <h1>جامع نورة سعد العبيد</h1>
                        <p>مواقيت الصلاة</p>
                    </div>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="about.html">عن المسجد</a></li>
                        <li><a href="gallery.html">مكتبة الصور</a></li>
                        <li><a href="prayer-times.html">مواقيت الصلاة</a></li>
                        <li><a href="contact.html">تواصل معنا</a></li>
                        <li><a href="news.html">الأخبار والفعاليات</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main id="prayer-times-page">
            <h2>مواقيت الصلاة - السالمية</h2>
            <div class="prayer-times-wrapper">
                <div id="q8prayers" data-lang="ar" data-theme="light" data-size="md" data-date="gregorian"></div>
            </div>
        </main>
    </div>
    <script src="https://q8p.io/js"></script>
    <script src="script.js"></script>
</body>
</html>
